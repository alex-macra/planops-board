name: Feature request
description: Suggest an improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Use fictional data only. Remove private paths, repository details, task IDs, credentials, and customer data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today? Use fictional data only.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: This request contains no credentials or private planning data.
          required: true
